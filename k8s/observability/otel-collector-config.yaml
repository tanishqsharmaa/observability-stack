apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: warden-observability
data:
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 20

      batch:
        send_batch_size: 256
        timeout: 1s

    exporters:
      prometheus:
        endpoint: 0.0.0.0:8889
        namespace: warden

      otlp/tempo:
        endpoint: tempo.warden-observability.svc.cluster.local:4317
        tls:
          insecure: true

      logging:
        verbosity: basic

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp/tempo, logging]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [prometheus]
