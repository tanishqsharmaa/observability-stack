apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: warden-observability
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.warden-observability.svc.cluster.local:9090
        isDefault: true
        jsonData:
          timeInterval: 10s
          exemplarTraceIdDestinations:
            - name: traceID
              datasourceUid: tempo
      - name: Tempo
        type: tempo
        access: proxy
        url: http://tempo.warden-observability.svc.cluster.local:3200
        uid: tempo
        jsonData:
          tracesToLogs:
            datasourceUid: prometheus
